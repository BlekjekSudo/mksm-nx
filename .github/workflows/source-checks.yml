name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public source contents
        run: python tools/check_public_tree.py
      - name: Test SD setup with synthetic files
        run: python -m unittest discover -s tests -p switch_setup_test.py -v
      - name: Test public SD release boundaries
        run: python -m unittest discover -s tests -p switch_release_test.py -v
      - name: Check Python syntax
        run: python -m compileall -q tools tests
